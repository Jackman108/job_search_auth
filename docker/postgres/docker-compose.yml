# DEPRECATED for day-to-day use.
# Prefer repo-root: docker/docker-compose.yml via .\dev-docker.ps1
# (job_search_postgres :5432 + job_search_redis :6379).
#
# Optional isolated auth DB remains available as auth_postgres :5433
# (root compose profile: auth-db) or `yarn docker:up` here.

services:
  postgres:
    container_name: auth_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-db_test}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./postgres/install-uuid.sql:/docker-entrypoint-initdb.d/01-install-uuid.sql:ro
    ports:
      - '${DB_PORT:-5433}:5432'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_test}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: job_search_redis
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - job_search_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_postgres_data:
  job_search_redis_data:
