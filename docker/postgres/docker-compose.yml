# Auth Postgres + Redis for Market Hunter (dev).
# Prefer root helper: ..\..\..\dev-docker.ps1 (reuses auth_redis; shared Postgres on :5432).
# From auth/: yarn docker:redis  (Redis only)  |  yarn docker:up  (Redis + optional auth_postgres)
#
# Host ports must NOT collide with backend:
#   shared/backend Postgres → 5432 (postgres_container)
#   auth Postgres           → 5433 (this file, optional)
#   auth Redis              → 6379
services:
  postgres:
    container_name: auth_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-db_test}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./postgres/install-uuid.sql:/docker-entrypoint-initdb.d/01-install-uuid.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: auth_redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - auth_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_postgres_data:
  auth_redis_data:
